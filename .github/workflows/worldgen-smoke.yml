# Worldgen benchmark: generates the same region with the vanilla Default world type and the Players Versus world type,
# each alone and next to C2ME and Lithium, and uploads timings, metrics, map images and the server log. The upgrade job
# reopens a world made by an older build with this one. The perf job times this commit against the one before it on
# the same runner, since timings between runners differ by more than most changes.
# It starts a Minecraft server, which requires accepting the Minecraft EULA (https://aka.ms/MinecraftEULA).
#
# Two ways to start it:
# - Push a commit whose message contains [smoke]. The repository owner accepted the Minecraft EULA for these runs
#   (2026-09-27). They use the default seed, radius and center below.
# - Actions > worldgen-smoke > Run workflow, ticking the EULA box. GitHub only offers this button once this file is
#   on the default branch.

name: worldgen-smoke
on:
  push:
  workflow_dispatch:
    inputs:
      accept_eula:
        description: "I accept the Minecraft EULA (https://aka.ms/MinecraftEULA) for this run"
        type: boolean
        default: false
      seed:
        description: "World seed"
        default: "8675309"
      radius:
        description: "Radius in chunks around the center (max 32)"
        default: "12"
      center:
        description: "Center chunk as x,z"
        default: "100,100"

jobs:
  smoke:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.accept_eula) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[smoke]'))
    strategy:
      fail-fast: false
      matrix:
        level_type: ["minecraft:normal", "players-versus:better_world"]
        # Other mods (Modrinth projects) to run alongside, for compatibility: the newest release for 1.21.10.
        mods: ["", "c2me-fabric lithium"]
        # "java-kernel": the Players Versus final density stays a Java kernel next to C2ME's compiler.
        variant: [""]
        include:
          # No level-type in server.properties: the mod makes Improved the server default.
          - level_type: "server-default"
            mods: ""
            variant: ""
          # Since d79ad84 the run next to C2ME and Lithium differs from the plain one (14 of 2,500 surface cells, water
          # in y 48..63). These two runs tell the compiled final density, and Lithium, apart from the rest.
          - level_type: "players-versus:better_world"
            mods: "c2me-fabric lithium"
            variant: "java-kernel"
          - level_type: "players-versus:better_world"
            mods: "c2me-fabric"
            variant: ""
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SEED: ${{ inputs.seed || '8675309' }}
      RADIUS: ${{ inputs.radius || '12' }}
      CENTER: ${{ inputs.center || '100,100' }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # Fabric Loader remaps jars in the run's mods folder at startup; Loom's modLocalRuntime would refuse mods built
      # with a newer Loom than this project's.
      - name: download compatibility mods
        env:
          UA: "L-Apostrophe-Ecuyer/JavaMC-PlayersVersus worldgen-smoke"
        run: |
          mkdir -p run/worldgen-smoke/mods
          for slug in ${{ matrix.mods }}; do
            read -r version url filename < <(curl -fsSL -A "$UA" \
              "https://api.modrinth.com/v2/project/$slug/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.10%22%5D" \
              | python3 -c 'import json, sys; v = json.load(sys.stdin)[0]; f = next(f for f in v["files"] if f["primary"]); print(v["version_number"], f["url"], f["filename"])')
            test -n "$url"
            echo "$slug $version"
            curl -fsSL -A "$UA" -o "run/worldgen-smoke/mods/$filename" "$url"
          done
          ls -la run/worldgen-smoke/mods
      - name: run worldgen smoke test
        run: >
          ./gradlew runWorldgenSmoke
          -Ppv.acceptEula=true
          "-Ppv.levelType=${{ matrix.level_type }}"
          "-Ppv.seed=$SEED"
          "-Ppv.benchRadius=$RADIUS"
          "-Ppv.benchCenter=$CENTER"
          "-Ppv.vanillaTypes=${{ matrix.variant == 'java-kernel' && 'false' || 'true' }}"
      - name: show report
        if: always()
        run: cat run/worldgen-smoke/pvwg/*/report.txt || true
      # The bench logs its own failures and still stops the server cleanly, so the run above can succeed without a report.
      - name: check that the bench wrote a report
        run: |
          ls run/worldgen-smoke/pvwg/*/report.txt
          if ls run/worldgen-smoke/crash-reports/* >/dev/null 2>&1; then echo "crash report written"; exit 1; fi
          if grep -n "\[pvwg\] bench failed" run/worldgen-smoke/logs/latest.log; then exit 1; fi
          if [ "${{ matrix.level_type }}" = "server-default" ]; then grep "^settings players-versus:overworld" run/worldgen-smoke/pvwg/*/report.txt; fi
      - name: artifact name
        id: name
        if: always()
        run: |
          echo "value=worldgen-smoke-$(echo '${{ matrix.level_type }} ${{ matrix.mods }} ${{ matrix.variant }}' | xargs | tr ': ' '-_')" >> "$GITHUB_OUTPUT"
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: |
            run/worldgen-smoke/pvwg/
            run/worldgen-smoke/logs/latest.log
            run/worldgen-smoke/crash-reports/
          if-no-files-found: warn

  # Reopens a Players Versus world made by an older build (OLD_COMMIT, before Phase 1: its preset still used vanilla's
  # multi_noise biome source) with this commit's build, and generates new chunks far from the old ones. Then generates
  # the same new chunks in a fresh world, for comparison.
  upgrade:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.accept_eula) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[smoke]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SEED: ${{ inputs.seed || '8675309' }}
      OLD_COMMIT: 37efc29
      # Old chunks around 100,88 and new ones around 100,108: 11 chunks apart, beyond the ring the old run generated
      # partway (structure starts), so the new region's biomes all come from this build.
      OLD_CENTER: "100,88"
      NEW_CENTER: "100,108"
      RADIUS: "4"
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
      - name: make the world with the old build
        run: |
          git checkout --detach "$OLD_COMMIT"
          chmod +x ./gradlew
          ./gradlew runWorldgenSmoke -Ppv.acceptEula=true "-Ppv.levelType=players-versus:better_world" \
            "-Ppv.seed=$SEED" "-Ppv.benchRadius=$RADIUS" "-Ppv.benchCenter=$OLD_CENTER"
          mkdir -p reports
          cp run/worldgen-smoke/pvwg/*/report.txt reports/old-build.txt
          rm -rf run/worldgen-smoke/pvwg
      - name: reopen it with this build
        run: |
          git checkout --detach "$GITHUB_SHA"
          chmod +x ./gradlew
          ./gradlew runWorldgenSmoke -Ppv.acceptEula=true -Ppv.keepWorld=true \
            "-Ppv.seed=$SEED" "-Ppv.benchRadius=$RADIUS" "-Ppv.benchCenter=$NEW_CENTER"
          cp run/worldgen-smoke/pvwg/*/report.txt reports/reopened.txt
          rm -rf run/worldgen-smoke/pvwg
          if ls run/worldgen-smoke/crash-reports/* >/dev/null 2>&1; then echo "crash report written"; exit 1; fi
          if grep -n "\[pvwg\] bench failed" run/worldgen-smoke/logs/latest.log; then exit 1; fi
          cp run/worldgen-smoke/logs/latest.log reports/reopened.log
      - name: same chunks in a fresh world with this build
        run: |
          ./gradlew runWorldgenSmoke -Ppv.acceptEula=true "-Ppv.levelType=players-versus:better_world" \
            "-Ppv.seed=$SEED" "-Ppv.benchRadius=$RADIUS" "-Ppv.benchCenter=$NEW_CENTER"
          cp run/worldgen-smoke/pvwg/*/report.txt reports/fresh.txt
      - name: show reports
        if: always()
        run: |
          set +e
          for f in reports/*.txt; do echo "===== $f"; cat "$f"; done
          echo "===== generators"
          grep -H "^generator " reports/*.txt
          echo "===== biomes and maps: reopened world vs fresh world (same seed and chunks)"
          diff <(sed -n '/^biomes at surface:/,$p' reports/reopened.txt) <(sed -n '/^biomes at surface:/,$p' reports/fresh.txt) \
            && echo "identical" || true
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldgen-smoke-upgrade
          path: |
            reports/
            run/worldgen-smoke/logs/
            run/worldgen-smoke/crash-reports/
          if-no-files-found: warn

  # Generates the Players Versus benchmark region with the previous commit, then with this one, then a vanilla world,
  # all on one runner, and prints the time per status side by side. "Previous" is the commit before the latest change to
  # the mod (its sources or build), so a push that only touches tests, docs or workflows still times the last change.
  perf:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.accept_eula) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[smoke]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      SEED: ${{ inputs.seed || '8675309' }}
      RADIUS: ${{ inputs.radius || '12' }}
      CENTER: ${{ inputs.center || '100,100' }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
      # The first run on a runner is 14-22% slower than the ones after it (measured with the same mod code on both
      # sides), so a short run comes first and its timings are dropped.
      - name: warm up
        run: |
          chmod +x ./gradlew
          ./gradlew runWorldgenSmoke -Ppv.acceptEula=true "-Ppv.levelType=players-versus:better_world" \
            "-Ppv.seed=$SEED" "-Ppv.benchRadius=4" "-Ppv.benchCenter=$CENTER"
          rm -rf run/worldgen-smoke/pvwg
      - name: pick the previous commit
        run: |
          changed=$(git log -1 --format=%H "$GITHUB_SHA" -- src/main build.gradle gradle.properties settings.gradle gradle)
          echo "PREVIOUS=$(git rev-parse "$changed~1")" >> "$GITHUB_ENV"
          echo "latest change to the mod: $(git log --oneline -1 "$changed")"
      # Each build runs twice, in the order previous, this, vanilla, vanilla, this, previous, and the compare step
      # averages the two runs: single runs of one build differ by up to 40% on a runner (91f014e's job, where "previous"
      # and "this" were nearly the same code), and the order cancels a drift over the job.
      - name: previous, this, vanilla, vanilla, this, previous
        run: |
          mkdir -p reports
          bench() {  # $1 report name, $2 commit, $3 level type
            git checkout --quiet --detach "$2"
            echo "::group::$1: $(git log --oneline -1)"
            chmod +x ./gradlew
            ./gradlew runWorldgenSmoke -Ppv.acceptEula=true "-Ppv.levelType=$3" \
              "-Ppv.seed=$SEED" "-Ppv.benchRadius=$RADIUS" "-Ppv.benchCenter=$CENTER"
            cp run/worldgen-smoke/pvwg/*/report.txt "reports/$1.txt"
            rm -rf run/worldgen-smoke/pvwg
            echo "::endgroup::"
          }
          bench previous-1 "$PREVIOUS" players-versus:better_world
          bench this-1 "$GITHUB_SHA" players-versus:better_world
          bench vanilla-1 "$GITHUB_SHA" minecraft:normal
          bench vanilla-2 "$GITHUB_SHA" minecraft:normal
          bench this-2 "$GITHUB_SHA" players-versus:better_world
          bench previous-2 "$PREVIOUS" players-versus:better_world
      - name: download C2ME and Lithium
        env:
          UA: "L-Apostrophe-Ecuyer/JavaMC-PlayersVersus worldgen-smoke"
        run: |
          mkdir -p perf-mods
          for slug in c2me-fabric lithium; do
            read -r version url filename < <(curl -fsSL -A "$UA" \
              "https://api.modrinth.com/v2/project/$slug/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.10%22%5D" \
              | python3 -c 'import json, sys; v = json.load(sys.stdin)[0]; f = next(f for f in v["files"] if f["primary"]); print(v["version_number"], f["url"], f["filename"])')
            test -n "$url"
            echo "$slug $version"
            curl -fsSL -A "$UA" -o "perf-mods/$filename" "$url"
          done
      # The same six runs next to C2ME and Lithium: C2ME compiles density functions it knows and calls the others, so a
      # change can speed up one setup and slow down the other.
      - name: previous, this, vanilla, vanilla, this, previous, next to C2ME and Lithium
        run: |
          mkdir -p run/worldgen-smoke/mods && cp perf-mods/*.jar run/worldgen-smoke/mods/
          bench() {  # $1 report name, $2 commit, $3 level type
            git checkout --quiet --detach "$2"
            echo "::group::$1: $(git log --oneline -1)"
            chmod +x ./gradlew
            ./gradlew runWorldgenSmoke -Ppv.acceptEula=true "-Ppv.levelType=$3" \
              "-Ppv.seed=$SEED" "-Ppv.benchRadius=$RADIUS" "-Ppv.benchCenter=$CENTER"
            cp run/worldgen-smoke/pvwg/*/report.txt "reports/$1.txt"
            rm -rf run/worldgen-smoke/pvwg
            echo "::endgroup::"
          }
          bench c2me-previous-1 "$PREVIOUS" players-versus:better_world
          bench c2me-this-1 "$GITHUB_SHA" players-versus:better_world
          bench c2me-vanilla-1 "$GITHUB_SHA" minecraft:normal
          bench c2me-vanilla-2 "$GITHUB_SHA" minecraft:normal
          bench c2me-this-2 "$GITHUB_SHA" players-versus:better_world
          bench c2me-previous-2 "$PREVIOUS" players-versus:better_world
          rm -rf run/worldgen-smoke/mods
      - name: compare
        if: always()
        run: |
          python3 - reports <<'EOF'
          import os, sys
          def read(path):
              times, metrics = {}, []
              if not os.path.exists(path):
                  return times, metrics
              for line in open(path):
                  parts = line.split()
                  if parts and parts[0] == "time":
                      times[parts[1]] = float(parts[-2])
                  elif parts and parts[0] == "metric":
                      metrics.append(line.rstrip())
              return times, metrics
          def mean(runs, status):
              values = [run[status] for run in runs if status in run]
              return sum(values) / len(values) if values else float('nan')
          def spread(runs, status):
              values = [run[status] for run in runs if status in run]
              return (max(values) - min(values)) / (sum(values) / len(values)) if len(values) > 1 else float('nan')
          def table(title, prefix):
              previous = [runs[prefix + "previous-1"][0], runs[prefix + "previous-2"][0]]
              this = [runs[prefix + "this-1"][0], runs[prefix + "this-2"][0]]
              vanilla = [runs[prefix + "vanilla-1"][0], runs[prefix + "vanilla-2"][0]]
              print(f"\n{title} (each the mean of two runs; spread: how far those two runs differ)")
              print(f"{'status':20} {'previous':>9} {'this':>9} {'vanilla':>9} {'this/prev':>10} {'this/vanilla':>13} "
                    f"{'spread prev':>12} {'spread this':>12} {'spread van.':>12}  (ms/chunk)")
              for status in runs[prefix + "this-1"][0]:
                  p, t, v = mean(previous, status), mean(this, status), mean(vanilla, status)
                  print(f"{status:20} {p:9.2f} {t:9.2f} {v:9.2f} {t / p:10.2f} {t / v:13.2f} "
                        f"{spread(previous, status):12.0%} {spread(this, status):12.0%} {spread(vanilla, status):12.0%}")
          names = [prefix + name for prefix in ["", "c2me-"]
                   for name in ["previous-1", "this-1", "vanilla-1", "vanilla-2", "this-2", "previous-2"]]
          runs = {name: read(os.path.join(sys.argv[1], name + ".txt")) for name in names}
          table("Players Versus alone", "")
          table("next to C2ME and Lithium", "c2me-")
          for name in ["previous-1", "this-1", "c2me-this-1"]:
              print(f"\nmetrics, {name}:"); print("\n".join(runs[name][1]))
          EOF
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldgen-smoke-perf
          path: |
            reports/
            run/worldgen-smoke/crash-reports/
          if-no-files-found: warn
