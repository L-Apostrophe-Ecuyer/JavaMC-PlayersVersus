plugins {
	// Minecraft 26.x ships unobfuscated with Mojang's names: this Loom doesn't remap.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/players-versus.accesswidener")

	mods {
		"modid" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			// Avoid the JDK 25 tiered-JIT native crash seen during client startup.
			vmArg "-XX:-TieredCompilation"
		}

		// Headless worldgen benchmark: starts a dedicated server on a fresh world, generates a square of chunks
		// stage by stage, writes timings, metrics and map images to run/worldgen-smoke/pvwg/, then stops.
		// Options: -Ppv.levelType=<world preset> -Ppv.seed=<seed> -Ppv.benchRadius=<chunks> -Ppv.benchCenter=<x,z>
		// -Ppv.keepWorld=true reopens the existing world instead of starting a fresh one.
		// -Ppv.vanillaTypes=false keeps the Java final density next to C2ME's compiler (DensityCompilerCompat).
		// The server only starts with -Ppv.acceptEula=true (you accept https://aka.ms/MinecraftEULA).
		worldgenSmoke {
			server()
			configName = "Worldgen smoke test"
			runDir = "run/worldgen-smoke"
			programArg "--nogui"
			vmArg "-Dpv.worldgen.bench=${providers.gradleProperty('pv.benchRadius').getOrElse('12')}"
			vmArg "-Dpv.worldgen.bench.center=${providers.gradleProperty('pv.benchCenter').getOrElse('100,100')}"
			vmArg "-Dpv.worldgen.vanillaTypes=${providers.gradleProperty('pv.vanillaTypes').getOrElse('true')}"
		}
	}

}

// Game tests (src/gametest) sort inventories on Fabric's headless game test server, with the game's real items and tags.
// Loom runs them as part of `check`. The server only starts with -Ppv.acceptEula=true (you accept
// https://aka.ms/MinecraftEULA); without it the task is skipped, since Fabric's game test server doesn't check the EULA.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "players-versus-gametest"
		enableGameTests = true
		enableClientGameTests = false
	}
}

def gameTestDir = file("build/run/gameTest")
def gameTestAcceptEula = providers.gradleProperty("pv.acceptEula").getOrElse("false") == "true"
loom.runs.matching { it.name == "gameTest" }.configureEach {
	vmArg "-Dfabric-api.gametest.report-file=${new File(gameTestDir, "report.xml")}"
}
tasks.matching { it.name == "runGameTest" }.configureEach {
	onlyIf("the game test server only starts with -Ppv.acceptEula=true") { gameTestAcceptEula }
	doFirst {
		gameTestDir.mkdirs()
		new File(gameTestDir, "eula.txt").text = "eula=true\n"
	}
}

def worldgenSmokeDir = file("run/worldgen-smoke")
def worldgenSmokeAcceptEula = providers.gradleProperty("pv.acceptEula").getOrElse("false") == "true"
def worldgenSmokeKeepWorld = providers.gradleProperty("pv.keepWorld").getOrElse("false") == "true"
def worldgenSmokeLevelType = providers.gradleProperty("pv.levelType").getOrElse("players-versus:better_world")
def worldgenSmokeProperties = [
		"level-seed"         : providers.gradleProperty("pv.seed").getOrElse("8675309"),
		"max-tick-time"      : "-1",
		"online-mode"        : "false",
		"spawn-protection"   : "0",
		"sync-chunk-writes"  : "false",
		"view-distance"      : "4",
		"simulation-distance": "4",
]
// "server-default" leaves level-type out, to test the preset a server picks when server.properties doesn't name one.
if (worldgenSmokeLevelType != "server-default") {
	worldgenSmokeProperties["level-type"] = worldgenSmokeLevelType
}
tasks.matching { it.name == "runWorldgenSmoke" }.configureEach {
	doFirst {
		worldgenSmokeDir.mkdirs()
		if (!worldgenSmokeKeepWorld) {
			new File(worldgenSmokeDir, "world").deleteDir()
		}
		new File(worldgenSmokeDir, "server.properties").text = worldgenSmokeProperties.collect { key, value -> "${key}=${value}" }.join("\n") + "\n"
		if (worldgenSmokeAcceptEula) {
			new File(worldgenSmokeDir, "eula.txt").text = "eula=true\n"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
	useJUnitPlatform()
	// Tests run the game's common code only; the client side would look for client classes that aren't on the test classpath.
	systemProperty "fabric.side", "server"
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
		showStandardStreams = true
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	// Every error in one build, for fixing them from CI's log.
	it.options.compilerArgs += ["-Xmaxerrs", "10000"]
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}